<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C.A.M.P. Vendor Terminal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <div class="boot crt-flicker" id="boot"></div>

  <header class="masthead" id="masthead" style="display:none;">
    <div class="camp-name" id="campName">CAMP NAME</div>
    <div class="meta-row">
      <span><span class="k">IN-GAME NAME:</span> <span class="v" id="ign">-</span></span>
      <span><span class="k">DISCORD:</span> <span class="v" id="discord">-</span></span>
      <span><span class="k">PLATFORM:</span> <span class="v" id="server">-</span></span>
    </div>
    <p class="tagline" id="tagline"></p>
    <p class="note" id="note"></p>
    <div class="trade-banner" id="tradeBanner" style="display:none;"></div>
  </header>

  <nav class="nav-row" id="navRow" style="display:none;">
    <a href="index.html" class="active">CATALOG</a>
    <a href="contact.html" id="contactLink" style="display:none;">CONTACT</a>
  </nav>

  <div class="controls" id="controls" style="display:none;">
    <input type="text" class="search-box" id="search" placeholder="SEARCH ITEMS / MODS...">
    <label class="toggle" id="toggleLabel">
      <input type="checkbox" id="showUnavailable">
      SHOW OUT-OF-STOCK
    </label>
  </div>

  <main id="catalog"></main>

  <div class="footer">
    <span>SELF-HOSTED CAMP VENDOR TERMINAL // <span id="lastUpdated"></span></span>
    <span>DATA: data/items.json + data/config.json</span>
  </div>
</div>

<div class="cart-bar" id="cartBar">
  <span class="count" id="cartCount">0 ITEMS SELECTED</span>
  <span class="spacer"></span>
  <button type="button" id="cartClearBtn">CLEAR</button>
  <button type="button" class="primary" id="cartReviewBtn">REVIEW REQUEST \u2192</button>
</div>

<script src="catalog.js"></script>
<script src="cart.js"></script>
<script src="script.js"></script>
</body>
</html>
