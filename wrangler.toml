name = "fo76-crafting-menu"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Required so the "mimetext" package (used to build the outgoing email) can
# use the Node built-ins it depends on. Without this, deploy fails with
# "Could not resolve 'path'" or similar.
compatibility_flags = ["nodejs_compat"]

# Required if your Cloudflare API token has access to more than one
# account (common if you've used Cloudflare for more than one site).
# Without this, deploying non-interactively (e.g. from GitHub Actions)
# fails with "More than one account available but unable to select one".
# Find yours: Cloudflare dashboard -> Account Home -> the ID in the URL
# (dash.cloudflare.com/<this-part>/...), or under Manage Account -> API.
account_id = "REPLACE_WITH_YOUR_CLOUDFLARE_ACCOUNT_ID"

# Uncomment and set this to your own domain once it's attached in the
# Cloudflare dashboard. Leave it out entirely to just use the default
# *.workers.dev URL Cloudflare gives you on first deploy.
# routes = [
#   { pattern = "your-subdomain.yourdomain.com", custom_domain = true }
# ]

# Static site files served from here
[assets]
directory = "./public"
binding = "ASSETS"

# Cloudflare Email Routing, lets the Worker send mail without any
# third-party API key. Your zone needs Email Routing enabled and the
# address below added as a verified destination address, then update
# RECIPIENT in src/index.js to match.
[[send_email]]
name = "SEB"
destination_address = "you@example.com"
